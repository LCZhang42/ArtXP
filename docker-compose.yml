services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: artxp
      POSTGRES_USER: artxp
      POSTGRES_PASSWORD: artxp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artxp -d artxp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: artxp
      MINIO_ROOT_PASSWORD: artxp-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    volumes:
      - ./infra/minio/cors.json:/tmp/cors.json:ro
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 artxp artxp-development-only;
      mc mb --ignore-existing local/artxp-artworks;
      mc anonymous set none local/artxp-artworks;
      mc cors set local/artxp-artworks /tmp/cors.json;
      "

  api:
    build:
      context: ./backend
    environment:
      ARTXP_ENVIRONMENT: development
      ARTXP_SESSION_SECRET: compose-development-secret-change-me
      ARTXP_DATABASE_URL: postgresql+psycopg://artxp:artxp@postgres:5432/artxp
      ARTXP_REDIS_URL: redis://redis:6379/0
      ARTXP_S3_ENDPOINT_URL: http://minio:9000
      ARTXP_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      ARTXP_S3_ACCESS_KEY: artxp
      ARTXP_S3_SECRET_KEY: artxp-development-only
      ARTXP_S3_BUCKET: artxp-artworks
      ARTXP_INFRASTRUCTURE_REQUIRED: "true"
      ARTXP_AUTO_CREATE_SCHEMA: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  minio_data: